name: public-check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: rules still fire
        run: python tools/check_public.py --selftest
      - name: nothing private in the repo
        run: python tools/check_public.py --all
